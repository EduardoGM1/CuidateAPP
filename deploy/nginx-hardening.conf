# Endurecimiento global de Nginx — incluir una vez en /etc/nginx/nginx.conf dentro de http { }:
#   include /var/www/CuidateAPP/deploy/nginx-hardening.conf;
#
# Oculta la versión en la cabecera Server (p. ej. nginx/1.24.0 → nginx).
server_tokens off;

# Para eliminar por completo la cabecera Server (auditorías que marcan "Server: nginx"):
#   sudo apt install -y libnginx-mod-http-headers-more-filter   # Ubuntu/Debian
#   more_clear_headers 'Server';
# Requiere recargar: sudo nginx -t && sudo systemctl reload nginx
