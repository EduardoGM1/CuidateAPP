# Nginx: CuidateAPP - Plantilla por defecto (solo IP)
# Para solo IP: reemplaza {{APP_ROOT}} (ej. /var/www/CuidateAPP) y usa este archivo.
# Para dominio (web + api en subdominio): usa nginx-cuidateapp-domain.conf
# El script setup-vps.sh elige automáticamente -ip o -domain según variables.

server {
    listen 80 default_server;
    server_name _;

    root {{APP_ROOT}}/cuidate-web/dist;
    index index.html;
    client_max_body_size 10M;

    include {{APP_ROOT}}/deploy/nginx-security-headers.inc;

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
